<title>Facturación · Taller Shahbaz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --steel:#12294f;
    --blue:#1c5dd8;
    --paper:#f6f3ec;
    --line:#d8d2c4;
    --ink:#1c1e24;
    --muted:#6b6357;
    --danger:#c0392b;
    --danger-bg:#fbeceb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding-bottom:96px;
  }
  input,select,textarea,button{
    -webkit-appearance:none;appearance:none;font-family:inherit;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:none;box-shadow:0 0 0 3px rgba(28,93,216,0.22);border-color:var(--blue);
  }
  .mono{
    font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }
  .app{max-width:560px;margin:0 auto;padding:0 14px;}

  .topbar{display:flex;align-items:center;gap:12px;padding:18px 2px 12px;}
  .brand-mark{
    width:46px;height:46px;border-radius:50%;background:var(--steel);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
    flex-shrink:0;overflow:hidden;letter-spacing:0.5px;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-mark img.hidden{display:none;}
  .brand-text{flex:1;min-width:0;}
  .brand-text h1{font-size:17px;margin:0;color:var(--steel);letter-spacing:0.2px;}
  .brand-text p{font-size:11.5px;margin:1px 0 0;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;}
  .icon-btn{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:16px;color:var(--steel);flex-shrink:0;
  }

  .doctype-toggle{
    display:flex;background:#fff;border-radius:12px;padding:4px;gap:4px;
    border:1px solid var(--line);margin-bottom:14px;
  }
  .toggle-btn{
    flex:1;padding:11px 6px;border:none;background:transparent;border-radius:9px;
    font-weight:700;font-size:13.5px;color:var(--muted);transition:background .15s,color .15s;
  }
  .toggle-btn.active{background:var(--steel);color:#fff;}

  .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line);}
  .card h2{
    font-size:12px;text-transform:uppercase;letter-spacing:0.7px;color:var(--blue);
    margin:0 0 12px;font-weight:700;border-bottom:2px solid var(--paper);padding-bottom:8px;
  }
  .hint{font-size:11px;color:var(--muted);margin:-6px 0 10px;}

  label{display:block;font-size:11px;color:var(--muted);margin-bottom:10px;font-weight:600;}
  input,select,textarea{
    width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);font-size:15px;background:#fdfcfa;
  }
  select{
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) center,calc(100% - 13px) center;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;
  }
  textarea{resize:vertical;font-size:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px;}

  .secondary-btn{
    width:100%;padding:12px;margin-top:2px;border-radius:10px;border:1.5px solid var(--blue);
    background:#fff;color:var(--blue);font-weight:700;font-size:13.5px;
  }
  .secondary-btn:active{background:#eef3ff;}

  .item-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fdfcfa;}
  .item-row input.item-desc{font-size:14.5px;}
  .item-fields{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:6px;margin-top:6px;align-items:center;}
  .item-fields input,.item-fields select{margin-top:0;padding:8px 6px;font-size:12.5px;text-align:right;}
  .item-fields select{text-align:center;padding-right:16px;background-position:calc(100% - 6px) center,calc(100% - 3px) center;}
  .item-remove{
    border:none;background:var(--danger-bg);color:var(--danger);width:32px;height:32px;
    border-radius:8px;font-size:14px;padding:0;
  }
  .item-subtotal{text-align:right;font-weight:700;margin-top:8px;color:var(--steel);font-size:13.5px;}

  .settings-row{display:flex;gap:8px;margin-top:4px;}
  .text-btn{
    flex:1;text-align:center;padding:10px 6px;border-radius:10px;border:1px dashed var(--line);
    background:#fff;color:var(--steel);font-size:11.5px;font-weight:700;
  }
  .file-label{position:relative;display:flex;align-items:center;justify-content:center;}
  .file-label input{position:absolute;inset:0;opacity:0;width:100%;}
  .danger-btn{
    width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px dashed #f0c4bf;
    background:#fff;color:var(--danger);font-size:11.5px;font-weight:700;
  }

  .collapsible .collapsible-body{display:none;padding-top:2px;}
  .collapsible.open .collapsible-body{display:block;}
  .collapsible-head{cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .chev{transition:transform .2s;color:var(--muted);font-size:11px;}
  .collapsible.open .chev{transform:rotate(180deg);}

  .bottom-bar{
    position:fixed;bottom:0;left:0;right:0;background:var(--steel);
    border-top:2px solid var(--blue);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .bottom-bar-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px;}
  .bottom-total{color:#fff;flex-shrink:0;}
  .bottom-total span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:0.6px;opacity:.7;}
  .bottom-total strong{font-size:19px;}
  .generate-btn{
    flex:1;background:var(--blue);color:#fff;border:none;padding:14px 16px;border-radius:12px;
    font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:0.3px;
  }
  .generate-btn:active{background:#123f96;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand-mark" id="brandMark">
      <img id="logoPreview" class="hidden" alt="Logo">
      <span id="logoPlaceholder">TS</span>
    </div>
    <div class="brand-text">
      <h1>Taller Shahbaz</h1>
      <p>Facturación móvil</p>
    </div>
    <button type="button" class="icon-btn" id="newDocBtn" title="Nuevo documento">⟲</button>
  </div>

  <div class="doctype-toggle">
    <button type="button" class="toggle-btn active" data-type="Factura">Factura</button>
    <button type="button" class="toggle-btn" data-type="Presupuesto">Presupuesto</button>
  </div>

  <section class="card">
    <h2>Documento</h2>
    <div class="grid3">
      <label>Número<input id="invNum" class="mono"></label>
      <label>Fecha<input id="invDate" type="date" class="mono"></label>
      <label>IVA
        <select id="ivaRate">
          <option value="21">21%</option>
          <option value="10">10%</option>
          <option value="4">4%</option>
          <option value="0">0%</option>
        </select>
      </label>
    </div>
  </section>

  <section class="card">
    <h2>Cliente</h2>
    <label>Cliente guardado
      <select id="clientSelect"><option value="">— Nuevo cliente —</option></select>
    </label>
    <label>Vehículo de ese cliente
      <select id="vehicleSelect"><option value="">—</option></select>
    </label>
    <div class="grid2">
      <label>Nombre / Empresa<input id="cName"></label>
      <label>DNI / NIF<input id="cNif"></label>
    </div>
    <div class="grid2">
      <label>Teléfono<input id="cPhone" type="tel" inputmode="tel"></label>
      <label>Código de cliente<input id="cCode"></label>
    </div>
    <label>Dirección<input id="cAddr"></label>
    <div class="grid2">
      <label>Código postal<input id="cCp" inputmode="numeric"></label>
      <label>Email<input id="cEmail" type="email"></label>
    </div>
  </section>

  <section class="card">
    <h2>Vehículo</h2>
    <div class="grid2">
      <label>Marca y modelo<input id="vModel"></label>
      <label>Matrícula<input id="vPlate"></label>
    </div>
    <div class="grid2">
      <label>Bastidor (VIN)<input id="vVin"></label>
      <label>Año<input id="vYear" inputmode="numeric"></label>
    </div>
    <div class="grid2">
      <label>Combustible<input id="vFuel"></label>
      <label>Kilometraje<input id="vKm" inputmode="numeric" class="mono"></label>
    </div>
    <button type="button" class="secondary-btn" id="saveClientBtn">💾 Guardar cliente y vehículo</button>
  </section>

  <section class="card">
    <h2>Conceptos</h2>
    <div id="itemsList"></div>
    <button type="button" class="secondary-btn" id="addItemBtn">+ Añadir línea</button>
  </section>

  <section class="card">
    <h2>Notas</h2>
    <textarea id="notes" rows="3" placeholder="Opcional"></textarea>
  </section>

  <section class="card collapsible" id="tallerCard">
    <h2 class="collapsible-head">Datos del taller <span class="chev">▾</span></h2>
    <div class="collapsible-body">
      <p class="hint">Estos datos aparecen en la cabecera del PDF. Normalmente no hace falta tocarlos.</p>
      <div class="grid2">
        <label>Nombre del taller<input id="wName" value="Taller Shahbaz"></label>
        <label>Titular<input id="wOwner" value="Hanif Bibi Muhammad Shahbaz"></label>
      </div>
      <div class="grid2">
        <label>DNI del titular<input id="wDni" value="17601942-L"></label>
        <label>N.R.E.<input id="wNre" value="V-6139"></label>
      </div>
      <div class="grid2">
        <label>Teléfono<input id="wPhone" type="tel" value="697655041"></label>
        <label>Segundo teléfono<input id="wPhone2" type="tel" value="632423736"></label>
      </div>
      <label>Email<input id="wEmail" type="email" value="tallerjumar127282@gmail.com"></label>
      <label>Dirección<input id="wAddr" value="C/Torrente 28 B"></label>
      <div class="grid2">
        <label>Código postal y ciudad<input id="wCpCity" value="46014 Valencia"></label>
        <label>Web<input id="wWeb" value="www.tallershahbaz.es"></label>
      </div>
      <div class="settings-row">
        <button type="button" class="text-btn" id="exportBtn">⬇ Exportar clientes</button>
        <label class="text-btn file-label">⬆ Importar clientes
          <input type="file" id="importInput" accept="application/json">
        </label>
      </div>
      <button type="button" class="danger-btn" id="resetDataBtn">🗑 Borrar datos guardados en este dispositivo</button>
    </div>
  </section>

</div>

<div class="bottom-bar">
  <div class="bottom-bar-inner">
    <div class="bottom-total">
      <span>Total</span>
      <strong id="totalDisplay" class="mono">0,00 €</strong>
    </div>
    <button type="button" class="generate-btn" id="generateBtn">Generar Factura (PDF)</button>
  </div>
</div>

  let clientes = [];
  let contador = { Factura:0, Presupuesto:0 };
  let items = [];
  let itemSeq = 0;
  let docType = 'Factura';

  function $(id){ return document.getElementById(id); }

  async function storageGet(key){
    try{
      if(!window.storage) return null;
      const res = await window.storage.get(key, false);
      return res ? res.value : null;
    }catch(e){ return null; }
  }
  async function storageSet(key, value){
    try{
      if(!window.storage) return false;
      await window.storage.set(key, value, false);
      return true;
    }catch(e){ console.error('storage set error', e); return false; }
  }
  async function storageDelete(key){
    try{
      if(!window.storage) return;
      await window.storage.delete(key, false);
    }catch(e){ /* key may not exist */ }
  }

  function fmt2(n){
    if (typeof n !== 'number' || isNaN(n)) n = 0;
    return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtG(n){
    if (typeof n !== 'number' || isNaN(n)) return '0';
    if (Number.isInteger(n)) return String(n);
    return parseFloat(n.toPrecision(12)).toString();
  }
  function todayIso(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function formatDateEs(isoDate){
    if(!isoDate) return '';
    const parts = isoDate.split('-');
    if(parts.length !== 3) return isoDate;
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function clientLabel(c){
    const nombre = (c.c_name||'').trim() || '(sin nombre)';
    const nif = (c.c_nif||'').trim();
    return nif ? `${nombre} — ${nif}` : nombre;
  }
  function vehicleLabel(v){
    const modelo = (v.v_model||'').trim() || '(sin modelo)';
    const placa = (v.v_plate||'').trim();
    return placa ? `${modelo} — ${placa}` : modelo;
  }
  function escapeAttr(v){
    return String(v ?? '').replace(/"/g,'&quot;');
  }
  function showLogo(has){
    $('logoPreview').classList.toggle('hidden', !has);
    $('logoPlaceholder').classList.toggle('hidden', has);
  }

  // ---------- Items ----------
  function addItemRow(data){
    data = data || {};
    const id = 'it' + (itemSeq++);
    items.push({
      id,
      desc: data.desc || '',
      qty: data.qty !== undefined ? data.qty : '1',
      price: data.price !== undefined ? data.price : '',
      disc: data.disc !== undefined ? data.disc : '0',
      discUnit: data.discUnit || '€',
    });
    renderItems();
  }
  function removeItemRow(id){
    items = items.filter(i => i.id !== id);
    renderItems();
  }
  function renderItems(){
    const list = $('itemsList');
    list.innerHTML = '';
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.dataset.id = item.id;
      row.innerHTML = `
        <input class="item-desc" placeholder="Descripción" value="${escapeAttr(item.desc)}">
        <div class="item-fields">
          <input class="item-qty mono" inputmode="decimal" placeholder="Cant." value="${escapeAttr(item.qty)}">
          <input class="item-price mono" inputmode="decimal" placeholder="Precio" value="${escapeAttr(item.price)}">
          <input class="item-disc mono" inputmode="decimal" placeholder="Desc." value="${escapeAttr(item.disc)}">
          <select class="item-disc-unit">
            <option value="€"${item.discUnit==='€'?' selected':''}>€</option>
            <option value="%"${item.discUnit==='%'?' selected':''}>%</option>
          </select>
          <button type="button" class="item-remove">✕</button>
        </div>
        <div class="item-subtotal mono">0,00 €</div>
      `;
      list.appendChild(row);

      const descEl = row.querySelector('.item-desc');
      const qtyEl = row.querySelector('.item-qty');
      const priceEl = row.querySelector('.item-price');
      const discEl = row.querySelector('.item-disc');
      const discUnitEl = row.querySelector('.item-disc-unit');
      const removeBtn = row.querySelector('.item-remove');

      const sync = () => {
        item.desc = descEl.value;
        item.qty = qtyEl.value;
        item.price = priceEl.value;
        item.disc = discEl.value;
        item.discUnit = discUnitEl.value;
        recalcTotal();
      };
      descEl.addEventListener('input', sync);
      qtyEl.addEventListener('input', sync);
      priceEl.addEventListener('input', sync);
      discEl.addEventListener('input', sync);
      discUnitEl.addEventListener('change', sync);
      removeBtn.addEventListener('click', () => removeItemRow(item.id));
    });
    recalcTotal();
  }

  function computeLine(item){
    const qty = parseFloat(String(item.qty).replace(',','.')) || 0;
    const price = parseFloat(String(item.price).replace(',','.')) || 0;
    const disc = parseFloat(String(item.disc).replace(',','.')) || 0;
    const base = qty * price;
    let discAmount, discLabel;
    if (item.discUnit === '%'){
      discAmount = base * disc / 100;
      discLabel = disc ? fmtG(disc) + '%' : '—';
    } else {
      discAmount = disc;
      discLabel = disc ? fmt2(disc) + ' €' : '—';
    }
    const lineNet = Math.max(0, base - discAmount);
    const ivaRate = parseFloat($('ivaRate').value) || 0;
    const lineTotal = lineNet * (1 + ivaRate/100);
    return { qty, price, discLabel, lineNet, lineTotal, ivaRate };
  }

  function recalcTotal(){
    let subtotalNeto = 0;
    document.querySelectorAll('.item-row').forEach(row => {
      const item = items.find(i => i.id === row.dataset.id);
      if(!item) return;
      const { lineNet, lineTotal } = computeLine(item);
      subtotalNeto += lineNet;
      const sub = row.querySelector('.item-subtotal');
      if(sub) sub.textContent = fmt2(lineTotal) + ' €';
    });
    const ivaRate = parseFloat($('ivaRate').value) || 0;
    const total = subtotalNeto + subtotalNeto*ivaRate/100;
    $('totalDisplay').textContent = fmt2(total) + ' €';
    return total;
  }

  // ---------- Clients ----------
  function refreshClientSelect(keepIndex){
    const sel = $('clientSelect');
    sel.innerHTML = '<option value="">— Nuevo cliente —</option>';
    clientes.forEach((c,i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = clientLabel(c);
      sel.appendChild(opt);
    });
    if (keepIndex !== undefined && keepIndex !== null && keepIndex >= 0){
      sel.value = keepIndex;
      onClientSelected();
    } else {
      sel.value = '';
      $('vehicleSelect').innerHTML = '<option value="">—</option>';
    }
  }
  function refreshVehicleSelect(clientIdx){
    const sel = $('vehicleSelect');
    sel.innerHTML = '<option value="">—</option>';
    if (clientIdx === '' || clientIdx === undefined || clientIdx === null) return;
    const c = clientes[clientIdx];
    if(!c) return;
    (c.coches||[]).forEach((v,i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = vehicleLabel(v);
      sel.appendChild(opt);
    });
  }
  function onClientSelected(){
    const idx = $('clientSelect').value;
    refreshVehicleSelect(idx);
    if (idx === ''){
      ['cName','cNif','cPhone','cAddr','cCp','cEmail','cCode'].forEach(f => $(f).value = '');
      ['vModel','vPlate','vVin','vYear','vFuel','vKm'].forEach(f => $(f).value = '');
      return;
    }
    const c = clientes[idx];
    $('cName').value = c.c_name||''; $('cNif').value = c.c_nif||'';
    $('cPhone').value = c.c_phone||''; $('cAddr').value = c.c_addr||'';
    $('cCp').value = c.c_cp||''; $('cEmail').value = c.c_email||'';
    $('cCode').value = c.c_code||'';
    if (c.coches && c.coches.length){
      $('vehicleSelect').value = 0;
      onVehicleSelected();
    } else {
      ['vModel','vPlate','vVin','vYear','vFuel','vKm'].forEach(f => $(f).value = '');
    }
  }
  function onVehicleSelected(){
    const cIdx = $('clientSelect').value;
    const vIdx = $('vehicleSelect').value;
    if (cIdx === '' || vIdx === '') return;
    const c = clientes[cIdx];
    if(!c) return;
    const v = (c.coches||[])[vIdx];
    if(!v) return;
    $('vModel').value = v.v_model||''; $('vPlate').value = v.v_plate||'';
    $('vVin').value = v.v_vin||''; $('vYear').value = v.v_year||'';
    $('vFuel').value = v.v_fuel||''; $('vKm').value = v.v_km||'';
  }
  async function saveClientAndVehicle(){
    const cName = $('cName').value.trim();
    const cNif = $('cNif').value.trim();
    if (!cName && !cNif){
      alert('Escribe al menos el nombre o el DNI/NIF del cliente antes de guardar.');
      return;
    }
    const clienteDatos = {
      c_name:cName, c_nif:cNif,
      c_phone:$('cPhone').value.trim(), c_addr:$('cAddr').value.trim(),
      c_cp:$('cCp').value.trim(), c_email:$('cEmail').value.trim(),
      c_code:$('cCode').value.trim(),
    };
    const cocheDatos = {
      v_model:$('vModel').value.trim(), v_plate:$('vPlate').value.trim(),
      v_vin:$('vVin').value.trim(), v_year:$('vYear').value.trim(),
      v_fuel:$('vFuel').value.trim(), v_km:$('vKm').value.trim(),
    };
    const tieneCoche = Object.values(cocheDatos).some(Boolean);

    let idxFound = -1;
    for (let i=0;i<clientes.length;i++){
      const c = clientes[i];
      if (cNif && (c.c_nif||'').trim() === cNif){ idxFound = i; break; }
      if (!cNif && (c.c_name||'').trim().toLowerCase() === cName.toLowerCase()){ idxFound = i; break; }
    }

    let idxFinal;
    if (idxFound >= 0){
      const c = clientes[idxFound];
      Object.assign(c, clienteDatos);
      c.coches = c.coches || [];
      if (tieneCoche){
        const placa = (cocheDatos.v_plate||'').trim().toLowerCase();
        let existing = null;
        if (placa) existing = c.coches.find(cc => (cc.v_plate||'').trim().toLowerCase() === placa);
        if (existing) Object.assign(existing, cocheDatos);
        else c.coches.push(cocheDatos);
      }
      idxFinal = idxFound;
    } else {
      const nuevo = Object.assign({}, clienteDatos);
      nuevo.coches = tieneCoche ? [cocheDatos] : [];
      clientes.push(nuevo);
      idxFinal = clientes.length - 1;
    }

    const ok = await storageSet(KEYS.CLIENTES, JSON.stringify(clientes));
    refreshClientSelect(idxFinal);
    alert(ok ? `Cliente «${cName||cNif}» guardado.` : `Cliente «${cName||cNif}» guardado solo para esta sesión (no se pudo guardar de forma permanente).`);
  }

  // ---------- Doc type / numbering ----------
  function nextNumberPreview(tipo){
    return String((contador[tipo]||0) + 1);
  }
  function onDocTypeChange(newType){
    docType = newType;
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.type === newType));
    $('invNum').value = nextNumberPreview(newType);
    $('generateBtn').textContent = `Generar ${newType} (PDF)`;
  }
  function resetForm(full){
    items = [];
    $('itemsList').innerHTML = '';
    addItemRow();
    $('notes').value = '';
    $('invDate').value = todayIso();
    $('invNum').value = nextNumberPreview(docType);
    if (full){
      ['cName','cNif','cPhone','cAddr','cCp','cEmail','cCode','vModel','vPlate','vVin','vYear','vFuel','vKm']
        .forEach(f => $(f).value = '');
      $('clientSelect').value = '';
      refreshVehicleSelect('');
    }
  }

  // ---------- PDF ----------
  function buildLegalText(tipo){
    if (tipo === 'Presupuesto'){
      return "Este documento es un presupuesto orientativo, sin validez fiscal como factura, y tiene una validez de 15 días desde la fecha de emisión. Los precios indicados pueden variar según el estado real del vehículo una vez iniciado el trabajo, y cualquier cambio será comunicado al cliente antes de proceder. La aceptación del presupuesto podrá realizarse de forma verbal, por WhatsApp o mediante firma. El taller no se hace responsable de los objetos dejados dentro del vehículo. Los datos facilitados por el cliente se utilizan únicamente para la prestación del servicio solicitado y podrán ser rectificados o suprimidos a petición del interesado, conforme a la normativa de protección de datos vigente.";
    }
    return "El taller no se hace responsable de los objetos dejados dentro del vehículo. El cliente acepta que, en caso de no abonar la totalidad de la factura, el vehículo quedará en depósito en las instalaciones del taller; pasados 10 días hábiles desde la finalización del trabajo se podrá aplicar un cargo diario por estacionamiento. Si la deuda alcanza el 80% del valor de mercado del vehículo o este permanece 90 días en depósito, el taller podrá tomar posesión del mismo como pago, sirviendo esta factura como único aviso al respecto. Los datos facilitados por el cliente se utilizan únicamente para la prestación del servicio solicitado y se conservarán mientras sea necesario para dicho fin; el interesado puede ejercer sus derechos de acceso, rectificación o supresión dirigiéndose por escrito a la dirección indicada en la cabecera de este documento. Las reparaciones reflejadas en esta factura, incluida la mano de obra, cuentan con una garantía de 3 meses o 2.000 km recorridos desde la fecha de entrega del vehículo (15 días en el caso de vehículos industriales). La garantía cubre únicamente las piezas sustituidas y corre a cargo del fabricante o proveedor de las mismas.";
  }

  async function generatePDF(){
    if (!window.jspdf){
      alert('No se pudo cargar la librería de PDF. Comprueba tu conexión a internet e inténtalo de nuevo.');
      return;
    }
    const validItems = items.filter(i => (i.desc||'').trim());
    if (!validItems.length){
      alert('Añade al menos una línea con descripción.');
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:'a4' });
    const pageW = 210, pageH = 297;
    const marginX = 18;
    const contentW = pageW - marginX*2;
    let y = 16;
    const STEEL = [18,41,79];
    const LINE = [216,210,196];
    const wName = $('wName').value.trim() || 'Taller Shahbaz';

    // Header
    try{
      doc.addImage(DEFAULT_LOGO, 'JPEG', marginX, y, 30, 30);
    }catch(e){
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(0,0,0);
      doc.text(wName, marginX, y+8);
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(24);
    doc.text(docType.toUpperCase(), pageW-marginX, y+8, {align:'right'});
    doc.setFontSize(10);
    doc.text(`${docType.toUpperCase()} Nº: ${$('invNum').value}`, pageW-marginX, y+15, {align:'right'});
    doc.text(`FECHA: ${formatDateEs($('invDate').value)}`, pageW-marginX, y+20, {align:'right'});
    y += 38;

    // Parties
    const leftX = marginX, rightX = marginX + contentW/2 + 6;
    const tallerLines = [
      wName.toUpperCase(),
      $('wOwner').value.toUpperCase(),
      $('wDni').value.toUpperCase(),
      [$('wPhone').value, $('wPhone2').value].filter(Boolean).join(' // ').toUpperCase(),
      $('wAddr').value.toUpperCase(),
      $('wCpCity').value.toUpperCase(),
      $('wEmail').value.toUpperCase(),
      $('wWeb').value.toUpperCase(),
      $('wNre').value ? ('N.R.E: ' + $('wNre').value).toUpperCase() : '',
    ].filter(Boolean);
    doc.setFontSize(9.5); doc.setFont('helvetica','bold');
    doc.text(tallerLines[0]||'', leftX, y);
    doc.setFont('helvetica','normal');
    let ly = y;
    tallerLines.slice(1).forEach(line => { ly += 4.2; doc.text(line, leftX, ly); });
    const leftBottom = ly;

    const clienteLines = [
      $('cName').value ? 'NOMBRE DEL CLIENTE: ' + $('cName').value : 'NOMBRE DEL CLIENTE:',
      'DNI: ' + ($('cNif').value||''),
      'TELEFONO: ' + ($('cPhone').value||''),
      'DIRECCION: ' + ($('cAddr').value||''),
      '',
      'CODIGO POSTAL: ' + ($('cCp').value||''),
      'CODIGO DE CLIENTE: ' + ($('cCode').value||''),
    ];
    let ry = y;
    clienteLines.forEach((line, idx) => {
      if (idx > 0) ry += 4.2;
      if (line) doc.text(line, rightX, ry);
    });
    y = Math.max(leftBottom, ry) + 10;

    // Vehicle
    const vehColW = contentW/2;
    doc.setFont('helvetica','bold');
    doc.text('MARCA Y MODELO:', leftX, y);
    doc.setFont('helvetica','normal');
    doc.text(` ${$('vModel').value}`, leftX + doc.getTextWidth('MARCA Y MODELO:'), y);
    doc.setFont('helvetica','bold');
    doc.text('KILOMETROS:', leftX+vehColW, y);
    doc.setFont('helvetica','normal');
    doc.text(` ${$('vKm').value}`, leftX+vehColW+doc.getTextWidth('KILOMETROS:'), y);
    y += 6;
    doc.setFont('helvetica','bold');
    doc.text('MATRICULA:', leftX, y);
    doc.setFont('helvetica','normal');
    doc.text(` ${$('vPlate').value}`, leftX + doc.getTextWidth('MATRICULA:'), y);
    doc.setFont('helvetica','bold');
    doc.text('BASTIDOR:', leftX+vehColW, y);
    doc.setFont('helvetica','normal');
    doc.text(` ${$('vVin').value}`, leftX+vehColW+doc.getTextWidth('BASTIDOR:'), y);
    y += 12;

    // Items table
    const ivaRate = parseFloat($('ivaRate').value) || 0;
    const colWidths = [58, 18, 24, 24, 16, 34];
    const headers = ['DESCRIPCIÓN','CANT.','PRECIO','DESCUENTO','IVA%','SUBTOTAL'];

    function drawTableHeader(){
      doc.setFillColor(STEEL[0],STEEL[1],STEEL[2]);
      doc.rect(marginX, y, contentW, 7, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
      let x = marginX;
      headers.forEach((h,i) => {
        if (i===0) doc.text(h, x+2, y+4.8);
        else doc.text(h, x+colWidths[i]-2, y+4.8, {align:'right'});
        x += colWidths[i];
      });
      y += 7;
      doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    }
    drawTableHeader();

    let subtotalNeto = 0;
    validItems.forEach(item => {
      const { qty, price, lineNet, lineTotal, discLabel } = computeLine(item);
      subtotalNeto += lineNet;
      const descLines = doc.splitTextToSize(item.desc, colWidths[0]-4);
      const rowH = Math.max(7, descLines.length*4.2 + 2.8);
      if (y + rowH > pageH - 60){ doc.addPage(); y = 20; drawTableHeader(); }
      let x = marginX;
      doc.text(descLines, x+2, y+5);
      x += colWidths[0];
      const vals = [fmtG(qty), fmt2(price)+' €', discLabel, fmtG(ivaRate)+'%', fmt2(lineTotal)+' €'];
      vals.forEach((v,i) => {
        doc.text(String(v), x+colWidths[i+1]-2, y+5, {align:'right'});
        x += colWidths[i+1];
      });
      doc.setDrawColor(LINE[0],LINE[1],LINE[2]);
      doc.line(marginX, y+rowH, marginX+contentW, y+rowH);
      y += rowH;
    });

    y += 5;
    if (y > pageH - 50){ doc.addPage(); y = 20; }
    const ivaAmount = subtotalNeto*ivaRate/100;
    const total = subtotalNeto + ivaAmount;
    doc.setFillColor(STEEL[0],STEEL[1],STEEL[2]);
    doc.rect(marginX, y, contentW, 9, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text('TOTAL:', marginX+4, y+6.2);
    doc.text(`€ ${fmt2(total)}`, marginX+contentW-4, y+6.2, {align:'right'});
    y += 9+10;
    doc.setTextColor(0,0,0);

    const notes = $('notes').value.trim();
    if (notes){
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      const noteLines = doc.splitTextToSize('Notas: '+notes, contentW);
      if (y + noteLines.length*4 > pageH-40){ doc.addPage(); y = 20; }
      doc.text(noteLines, marginX, y);
      y += noteLines.length*4 + 8;
    }

    if (y > pageH-40){ doc.addPage(); y = 20; }
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('GRACIAS POR VISITAR NUESTRO TALLER', marginX, y);
    y += 8;

    doc.setFont('helvetica','normal'); doc.setFontSize(7.3); doc.setTextColor(68,68,68);
    const legalLines = doc.splitTextToSize(buildLegalText(docType), contentW);
    if (y + legalLines.length*3.2 > pageH-10){ doc.addPage(); y = 20; }
    doc.text(legalLines, marginX, y);

    const safeNum = ($('invNum').value || 'sin_numero').replace(/\s+/g,'_');
    doc.save(`${docType}_${safeNum}.pdf`);

    contador[docType] = (contador[docType]||0) + 1;
    await storageSet(KEYS.CONTADOR, JSON.stringify(contador));
    $('invNum').value = nextNumberPreview(docType);
  }

  // ---------- Export / Import / Reset ----------
  function exportClientes(){
    const blob = new Blob([JSON.stringify(clientes, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'clientes_taller_shahbaz.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  function importClientesFile(file){
    const reader = new FileReader();
    reader.onload = async (e) => {
      try{
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) throw new Error('bad format');
        clientes = data;
        await storageSet(KEYS.CLIENTES, JSON.stringify(clientes));
        refreshClientSelect();
        alert(`Importados ${clientes.length} clientes.`);
      }catch(err){
        alert('No se pudo importar el archivo: formato no válido.');
      }
    };
    reader.readAsText(file);
  }

  // ---------- Init ----------
  async function init(){
    $('invDate').value = todayIso();

    const storedClientes = await storageGet(KEYS.CLIENTES);
    if (storedClientes){ try{ clientes = JSON.parse(storedClientes); }catch(e){ clientes = []; } }
    const storedContador = await storageGet(KEYS.CONTADOR);
    if (storedContador){ try{ contador = JSON.parse(storedContador); }catch(e){ contador = {Factura:0,Presupuesto:0}; } }
    $('logoPreview').src = DEFAULT_LOGO;
    showLogo(true);

    refreshClientSelect();
    $('invNum').value = nextNumberPreview(docType);
    addItemRow();

    document.querySelectorAll('.toggle-btn').forEach(b => {
      b.addEventListener('click', () => onDocTypeChange(b.dataset.type));
    });
    $('ivaRate').addEventListener('change', recalcTotal);
    $('clientSelect').addEventListener('change', onClientSelected);
    $('vehicleSelect').addEventListener('change', onVehicleSelected);
    $('saveClientBtn').addEventListener('click', saveClientAndVehicle);
    $('addItemBtn').addEventListener('click', () => addItemRow());
    $('generateBtn').addEventListener('click', generatePDF);
    $('newDocBtn').addEventListener('click', () => {
      if (confirm('¿Borrar los datos del cliente, vehículo y conceptos y empezar un documento nuevo?')) resetForm(true);
    });
    $('exportBtn').addEventListener('click', exportClientes);
    $('importInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) importClientesFile(file);
    });
    $('resetDataBtn').addEventListener('click', async () => {
      if (!confirm('¿Borrar todos los clientes, el logo y el contador guardados en este dispositivo? No se puede deshacer.')) return;
      await storageDelete(KEYS.CLIENTES);
      await storageDelete(KEYS.CONTADOR);
      clientes = []; contador = {Factura:0, Presupuesto:0};
      refreshClientSelect();
      $('invNum').value = nextNumberPreview(docType);
      alert('Datos borrados.');
    });
    $('tallerCard').querySelector('.collapsible-head').addEventListener('click', () => {
      $('tallerCard').classList.toggle('open');
    });
  }

  document.addEventListener('DOMContentLoaded', init);

  if ('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
